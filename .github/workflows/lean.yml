name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build and audit all project declarations
        run: bash scripts/check.sh
      - name: Retain verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-log
          path: build/verification.log
          if-no-files-found: ignore
